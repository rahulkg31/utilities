# Loaded when a test uses @ActiveProfiles("test").
# In-memory H2, no files on disk, no external DB required.

server:
  port: 0   # random port, avoids clashing with a running local instance

# Consumed by JdbcProperties / JdbcConfig (same custom DataSource + Hikari setup as the default profile)
db:
  type: jdbc
  jdbc:
    type: h2
    database: mem:testdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
    pool:
      pool-name: h2-test-pool
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout-ms: 10000
      idle-timeout-ms: 600000
      max-lifetime-ms: 1800000
      leak-detection-threshold-ms: 0
